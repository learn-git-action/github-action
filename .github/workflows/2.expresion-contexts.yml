name: Expression Contexts
on:
    workflow_dispatch:
    push:
        branches:
        - dev-ps
run-name: "change for ${{ github.event.head_commit.message }} from source bracnh: ${{ github.ref }} by ${{ github.event.head_commit.committer }} on event ${{ github.event_name }}"
## run-name supports expressions to provide dynamic names for workflow runs..
jobs:
    display-contexts:
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'push' }} ## conditional to run this job only on push event
        steps:
            - name: Display GitHub Context
              id: display_contexts-id
              run: |
                  echo "commit message: ${{ github.event.head_commit.message }}"
                  echo "github context ${{ tojson(github) }}" ## provide entire github context in json format
                  echo "myjob: ${{ toJson(job)}}"
                  echo "Repository: ${{ github.repository }}" ### only github without tojson gives string value of repository
                  echo 'github event ${{ github.event}}'
                  echo "Actor: ${{ github.actor }}"
                  echo "Event Name: ${{ github.event_name }}"
                  echo "Ref: ${{ github.ref }}"
                  echo "SHA: ${{ github.sha }}"

            - name: Display Runner Context
              run: |
                  echo "Runner Context:"
                  echo "OS: ${{ runner.os }}"
                  echo "Temp Directory: ${{ runner.temp }}"
                  echo "Tool Cache Directory: ${{ runner.tool_cache }}"

            - name: Display Job Context
              run: |
                  echo "Job Context:"
                  echo "Job Status: ${{ job.status }}"
                  echo "Job ID: ${{ job.id }}"

            # - name: Display Workflow Context
            #   run: |
            #       echo "Workflow Context:"
            #       echo "Workflow ${{ workflow.name }}"
            #       echo "Workflow Run ID: ${{ workflow.run_id }}"
            #       echo "Workflow Run Number: ${{ workflow.run_number }}"