name: Expression Contexts
on:
    workflow_dispatch:
    push:
        branches:
        - dev-ps
run-name: "Expression Contexts on ${{ github.ref }} by ${{ github.actor }} on event ${{ github.event_name }} commit message ${{ github.event.head_commit.message }}"
## run-name supports expressions to provide dynamic names for workflow runs.
jobs:
    display-contexts:
        runs-on: ubuntu-latest
        steps:
            - name: Display GitHub Context
              run: |
                  echo "GitHub Context:"
                  echo "Repository: ${{ github.repository }}"
                  echo "Actor: ${{ github.actor }}"
                  echo "Event Name: ${{ github.event_name }}"
                  echo "Ref: ${{ github.ref }}"
                  echo "SHA: ${{ github.sha }}"

            - name: Display Runner Context
              run: |
                  echo "Runner Context:"
                  echo "OS: ${{ runner.os }}"
                  echo "Temp Directory: ${{ runner.temp }}"
                  echo "Tool Cache Directory: ${{ runner.tool_cache }}"

            - name: Display Job Context
              run: |
                  echo "Job Context:"
                  echo "Job Status: ${{ job.status }}"
                  echo "Job ID: ${{ job.id }}"

            # - name: Display Workflow Context
            #   run: |
            #       echo "Workflow Context:"
            #       echo "Workflow ${{ workflow.name }}"
            #       echo "Workflow Run ID: ${{ workflow.run_id }}"
            #       echo "Workflow Run Number: ${{ workflow.run_number }}"