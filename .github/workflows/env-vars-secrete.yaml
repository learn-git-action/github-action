name: Environment variable workflow
on: 
    workflow_dispatch:
    push:
        branches:
          - dev-ps
        # paths:
        #     - 'env-vars-secrets/**'
defaults:
    run:
     working-directory: ./env-vars-secrets ##default working directory for all run commands
env:
    PORT: 3000
    API_KEY: "your-super-secret-api-key-here"
    SECRET_MESSAGE: "This is my top secret message!"
    NODE_ENV: "development"
    CLUSTER_ADDRESS: "mongodb+srv://cluster0.example.mongodb.net"
    DB_USER: ${{ secrets.DB_USER }}  ## using repo secerte configured in repo settings->secretes
    DB_PASSWORD: ${{ secrets.DB_PASSWORD }} ## using repo secerte configured in repo settings->secretes
    DB_NAME: "myDatabase"
jobs:
    test-connect:
        env:
            PROJECT_DIR: ./env-vars-secrets ## this env var can be used ONLY IN THIS "test-connect" job
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                ref: dev-ps
            - name: install nodejs
              uses: actions/setup-node@v6
              with:
                node-version: '24.x' 
            - name: instal dependencies
              run: npm install
            - name: run server
              run : npm start & npx wait-on http://localhost:${{ env.PORT }} ## We have used env variables
            - name: Output information
              run : |
                    echo "Running in environment: $NODE_ENV"
                    echo "Connecting to database at: $CLUSTER_ADDRESS"
                    echo "Database Name: $DB_NAME"
                    echo "Database User: ${{ env.DB_USER }}"
                
    deployment:
        needs: test-connect
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                ref: dev-ps
            - name: run deployment scripts
              run : echo "Deploying application to server..."
            