name: Metrix Workflow
on:
  workflow_dispatch:
  push:
    branches:
      - dev-ps
defaults:
    run:
     working-directory: ./nodejs-workflow
jobs:
  build:
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        operating-system: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.operating-system }} ## each job will run on specified OS in matrix with each node version.
    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
            ref: dev-ps
      - name: Install NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Build project
        run: npm run build

  