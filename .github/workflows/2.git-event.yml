name: Repo event
on:
    workflow_dispatch:
    push: ## all the filters should get one match to trigger the workflow.like branch filter and path filter.
      branches: ## below order is importent
        #- dev-ps
        - "feature/*" ## trigger feature/abc
        - "feature/**" ## trigger feature/abc/xyz
        - "!feature/wip" ## exclude feature/wip branch
      paths:
        - 'src/**'  ## trigger only if changes in src folder
        - '!.github/**' ## exclude changes in .github folder   
    pull_request:
        types: [opened, assigned, reopened, synchronize, labeled]
jobs:
    display-event-info:
        runs-on: ubuntu-latest
        steps:
            - name: Display event info
              run: |
                 echo "Event Name: ${{ github.event_name }}"
                 echo "Event Action: ${{ github.event.action || 'N/A' }}"
                 echo "Ref: ${{ github.ref }}"
                 echo "SHA: ${{ github.sha }}"
                 echo "Repository: ${{ github.repository }}"
                 echo "Actor: ${{ github.actor }}"
                 echo "Event Payload:"
                 echo "${{ toJson(github.event) }}"