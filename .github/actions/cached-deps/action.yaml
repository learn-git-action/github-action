name: 'npm install & cache dependencies'
description: 'An action to get and cache nodejs dependencies'
runs:
  using: 'composite'
  steps:
    - name: install nodejs
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
    - name: cache dependencies ## to remove same installtion again in below jobs.
      uses: actions/cache@v5
      with:
        path: ~/.npm
        key:  ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }} ## key based on package-lock.json file hash
    - name: Install dependencies
      working-directory: ${{ env.PROJECT_DIR }}
      run: |
        pwd
        npm i --legacy-peer-deps
        npm i --package-lock-only
        npm ci
        npm i env-cmd
      shell: bash ## specify shell type is MUST
